# Inkwell house style (same as MediaPull) (CLAUDE.md): 140-column lines. Rules that disagree with how the codebase is written are off.
included:
  - Inkwell
  - InkwellKit/Sources
  - InkwellKit/Tests
excluded:
  - InkwellKit/.build
line_length:
  warning: 140
  error: 160
  ignores_urls: true
disabled_rules:
  - trailing_comma
  - opening_brace
  - identifier_name
  - type_name
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - nesting
  - large_tuple
  - multiple_closures_with_trailing_closure
