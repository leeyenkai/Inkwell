---
layout: default
---

<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        {% if page.byline %}
        <p class="post-byline">{{ page.byline }}</p>
        {% endif %}
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
    </header>
    <div class="post-content">
        {{ content }}
    </div>
    <footer class="post-footer">
        <a href="{{ page.collection | prepend: '/' | relative_url }}" class="back-link">← Back to {{ page.collection }}</a>
    </footer>
</article>
