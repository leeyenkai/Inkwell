<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include inkwell-head.html %}
  <link rel="stylesheet" href="{{ '/assets/css/inkwell-blocks.css' | relative_url }}">
  <script src="{{ '/assets/js/inkwell-blocks.js' | relative_url }}" defer></script>
</head>
<body class="theme-{{ site.inkwell.theme | default: 'inkwell' }} layout-{{ page.layout | default: 'page' }}{% if page.wide %} is-wide{% endif %}">
  <a class="skip-link" href="#content">Skip to content</a>
  {% include inkwell-header.html %}
  <main id="content" class="container">
    {{ content }}
  </main>
  {% include inkwell-footer.html %}
</body>
</html>
